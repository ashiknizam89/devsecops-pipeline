name: DevSecOps Security Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sast-scan:
    name: SAST - Bandit Code Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit SAST scan
        run: |
          echo "🔍 Running Bandit static code analysis..."
          bandit -r app/ -f txt -o bandit-report.txt || true
          cat bandit-report.txt

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-sast-report
          path: bandit-report.txt
          if-no-files-found: error

  container-scan:
    name: Container - Trivy Image Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build Docker image
        run: |
          echo "🐳 Building Docker image..."
          docker build -t devsecops-demo:latest .

      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.70.0
          image-ref: devsecops-demo:latest
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH

      - name: Run Trivy - save report
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD":/out \
            aquasec/trivy:0.70.0@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e image \
            --format json \
            --output /out/trivy-report.json \
            --severity CRITICAL,HIGH \
            devsecops-demo:latest || true

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-report
          path: trivy-report.json
          if-no-files-found: error

  dast-scan:
    name: DAST - OWASP ZAP Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build and start app
        run: |
          echo "🚀 Starting application for DAST scanning..."
          docker build -t devsecops-demo:latest .
          docker run -d -p 5000:5000 --name demo-app devsecops-demo:latest
          sleep 10
          curl -f http://localhost:5000/health || exit 1
          echo "✅ App is running"

      - name: Run OWASP ZAP baseline scan
        run: |
          # ZAP writes reports to /zap/wrk and runs as a non-root user
          chmod a+w "$PWD"
          docker run --rm \
            --network host \
            -v "$PWD":/zap/wrk:rw \
            ghcr.io/zaproxy/zaproxy:2.17.0@sha256:5ccfff9a411743ab2615136a2edd7416bec9ce41572fa94e935df38c14adb2b6 \
            zap-baseline.py \
            -t http://localhost:5000 \
            -r zap-report.html \
            -I || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v7
        with:
          name: zap-dast-report
          path: zap-report.html
          if-no-files-found: error

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [sast-scan, container-scan, dast-scan]
    steps:
      - name: Print security summary
        run: |
          echo "========================================"
          echo "  DEVSECOPS PIPELINE - SECURITY SUMMARY"
          echo "========================================"
          echo "✅ SAST Scan (Bandit)     - Complete"
          echo "✅ Container Scan (Trivy) - Complete"
          echo "✅ DAST Scan (OWASP ZAP)  - Complete"
          echo ""
          echo "📄 All reports available in Actions artifacts"
          echo "========================================"
